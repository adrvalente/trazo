<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141d"><title>Quadro — V0.1</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div class="brand"><span class="mark">✎</span><div><strong>Quadro</strong><small>O teu espaço criativo</small></div></div><div class="header-actions"><span id="saveStatus">Guardado localmente</span><button id="newBtn" title="Novo quadro">＋ <span>Novo</span></button><button id="exportBtn" title="Exportar PNG">⇩ <span>PNG</span></button><button id="fullBtn" title="Ecrã completo">⛶</button></div></header><main><aside id="sidebar"><div class="side-head"><span>OS MEUS QUADROS</span><button id="collapseBtn" title="Recolher">☰</button></div><div id="boards"></div><div class="side-foot">V0.1 · Funciona offline após carregamento</div></aside><section id="workspace"><div class="canvas-head"><input id="boardTitle" aria-label="Nome do quadro" value="O meu primeiro quadro"><span id="hint">Desenha com o dedo ou caneta</span></div><div id="stage"><canvas id="canvas"></canvas><div class="zoom-tools"><button id="zoomOut" title="Diminuir zoom">−</button><span id="zoomLabel">100%</span><button id="zoomIn" title="Aumentar zoom">＋</button><button id="resetView" title="Repor vista">⌖</button></div></div><div class="toolbar" role="toolbar" aria-label="Ferramentas"><button data-tool="pen" class="selected" title="Caneta">✎</button><button data-tool="highlighter" title="Marcador">▰</button><button data-tool="eraser" title="Borracha">◯</button><button data-tool="hand" title="Mover quadro">✋</button><div class="separator"></div><div id="colors"><button class="swatch active" data-color="#e9edf5" style="--swatch:#e9edf5" aria-label="Branco"></button><button class="swatch" data-color="#f7c45d" style="--swatch:#f7c45d" aria-label="Amarelo"></button><button class="swatch" data-color="#ff788e" style="--swatch:#ff788e" aria-label="Rosa"></button><button class="swatch" data-color="#71d7bd" style="--swatch:#71d7bd" aria-label="Verde"></button><button class="swatch" data-color="#78b9ff" style="--swatch:#78b9ff" aria-label="Azul"></button><input type="color" id="customColor" value="#e9edf5" title="Outra cor"></div><div class="separator"></div><label class="size-label" title="Espessura">● <input id="size" type="range" min="1" max="32" value="4"></label><div class="separator"></div><button id="undoBtn" title="Desfazer">↶</button><button id="redoBtn" title="Refazer">↷</button><button id="clearBtn" title="Limpar quadro">⌫</button></div></section></main></div><dialog id="confirmDialog"><h3>Limpar o quadro?</h3><p>Todos os traços deste quadro serão apagados.</p><div><button id="cancelClear">Cancelar</button><button id="confirmClear">Limpar</button></div></dialog><script src="app.js"></script></body></html>
