<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141d"><title>Quadro — V0.2</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div class="brand"><span class="mark">✎</span><div><strong>Quadro</strong><small>Touch & Notes · V0.2</small></div></div><div class="header-actions"><span id="saveStatus">Guardado localmente</span><button id="sidebarBtn" title="Mostrar quadros">☰</button><button id="newBtn" title="Novo quadro">＋ <span>Novo</span></button><button id="importBtn" title="Importar ficheiro de quadro">↥ <span>Abrir</span></button><button id="backupBtn" title="Guardar ficheiro editável">▣ <span>Backup</span></button><button id="exportBtn" title="Exportar PNG">⇩ <span>PNG</span></button><button id="fullBtn" title="Ecrã completo">⛶</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div></header><main><aside id="sidebar"><div class="side-head"><span>OS MEUS QUADROS</span><button id="collapseBtn" title="Recolher">×</button></div><div id="boards"></div><div class="side-foot">V0.2 · Dados guardados neste browser</div></aside><section id="workspace"><div class="canvas-head"><input id="boardTitle" aria-label="Nome do quadro" value="O meu primeiro quadro"><div class="head-controls"><label>Fundo <select id="background"><option value="dots">Pontilhado</option><option value="plain">Liso</option><option value="grid">Quadriculado</option><option value="lines">Pautado</option></select></label><label>Cor <select id="theme"><option value="dark">Escuro</option><option value="light">Claro</option></select></label></div></div><div id="stage"><canvas id="canvas" aria-label="Área de desenho interativa"></canvas><div id="tip">Toca para adicionar · Arrasta para desenhar · Dois dedos para zoom</div><div class="zoom-tools"><button id="zoomOut" title="Diminuir zoom">−</button><span id="zoomLabel">100%</span><button id="zoomIn" title="Aumentar zoom">＋</button><button id="resetView" title="Repor vista">⌖</button></div></div><div class="toolbar" role="toolbar" aria-label="Ferramentas"><button data-tool="pen" class="selected" title="Caneta">✎</button><button data-tool="highlighter" title="Marcador">▰</button><button data-tool="eraser" title="Borracha">◯</button><button data-tool="hand" title="Mover quadro / mover notas">✋</button><button data-tool="note" title="Nota adesiva">▤</button><button data-tool="text" title="Caixa de texto">T</button><button data-tool="rect" title="Retângulo">▢</button><button data-tool="ellipse" title="Elipse">◯</button><button data-tool="line" title="Linha">╱</button><div class="separator"></div><div id="colors"><button class="swatch active" data-color="#e9edf5" style="--swatch:#e9edf5" aria-label="Branco"></button><button class="swatch" data-color="#f7c45d" style="--swatch:#f7c45d" aria-label="Amarelo"></button><button class="swatch" data-color="#ff788e" style="--swatch:#ff788e" aria-label="Rosa"></button><button class="swatch" data-color="#71d7bd" style="--swatch:#71d7bd" aria-label="Verde"></button><button class="swatch" data-color="#78b9ff" style="--swatch:#78b9ff" aria-label="Azul"></button><input type="color" id="customColor" value="#e9edf5" title="Outra cor"></div><div class="separator"></div><label class="size-label" title="Espessura">● <input id="size" type="range" min="1" max="32" value="4"></label><div class="separator"></div><button id="undoBtn" title="Desfazer">↶</button><button id="redoBtn" title="Refazer">↷</button><button id="clearBtn" title="Limpar quadro">⌫</button></div></section></main></div><dialog id="editDialog"><h3 id="editHeading">Adicionar nota</h3><textarea id="editText" rows="5" placeholder="Escreve aqui..."></textarea><div class="dialog-actions"><button id="deleteObject" class="danger" hidden>Eliminar</button><button id="cancelEdit">Cancelar</button><button id="confirmEdit" class="primary">Guardar</button></div></dialog><dialog id="confirmDialog"><h3>Limpar o quadro?</h3><p>Todos os elementos deste quadro serão apagados.</p><div class="dialog-actions"><button id="cancelClear">Cancelar</button><button id="confirmClear" class="danger">Limpar</button></div></dialog><script src="app.js"></script></body></html>
